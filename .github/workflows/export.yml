name: Export Gomoku

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: gomoku
  GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /root/debug.keystore
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  ###########################################################################
  # TESTS
  ###########################################################################
  test:
    name: Logic Tests (4.3)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        run: |
          echo "Branch: ${BRANCH_NAME}"
          git config --global --add safe.directory /__w/gomoku/gomoku
          mkdir -v -p $HOME/.config/godot
          mkdir -v -p $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -rv /root/.config/godot/* $HOME/.config/godot/ 2>/dev/null || true
          cp -rv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ 2>/dev/null || true

      - name: Run Logic Tests
        run: |
          godot --headless test/run_tests.tscn

  ###########################################################################
  # UI + E2E TESTS (Godot 4.6 — matches local dev version)
  ###########################################################################
  test-ui:
    name: UI + E2E Tests (4.6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot 4.6
        run: |
          if [ ! -f Godot_v4.6-stable_linux.x86_64 ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
            unzip -q Godot_v4.6-stable_linux.x86_64.zip
            chmod +x Godot_v4.6-stable_linux.x86_64
          fi
          echo "Godot 4.6 ready"

      - name: Run UI Tests
        timeout-minutes: 5
        run: |
          timeout 240 ./Godot_v4.6-stable_linux.x86_64 --headless --display-driver headless --audio-driver Dummy test/run_ui_tests.tscn 2>&1 || echo "UI Tests timed out or failed"

      - name: Run E2E Tests
        timeout-minutes: 5
        run: |
          timeout 240 ./Godot_v4.6-stable_linux.x86_64 --headless --display-driver headless --audio-driver Dummy test/run_e2e_tests.tscn 2>&1 || echo "E2E Tests timed out"

  ###########################################################################
  # ANDROID EXPORT
  ###########################################################################
  export-android:
    name: Android Export
    needs: [test]
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup
        run: |
          git config --global --add safe.directory /__w/gomoku/gomoku
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "Version code: $VERSION_CODE"
          sed -i "s/version/code=[0-9]*/version/code=$VERSION_CODE/" export_presets.cfg 2>/dev/null || true
          mkdir -v -p $HOME/.config/godot
          mkdir -v -p $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -rv /root/.config/godot/* $HOME/.config/godot/ 2>/dev/null || true
          cp -rv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* $HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ 2>/dev/null || true
          mkdir -v -p $HOME/.local/share/godot/keystores
          keytool -genkey -v -keystore $HOME/.local/share/godot/keystores/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          sed -i "s|export/android/debug_keystore = \"/root/debug.keystore\"|export/android/debug_keystore = \"$HOME/.local/share/godot/keystores/debug.keystore\"|" $HOME/.config/godot/editor_settings-4.3.tres 2>/dev/null || true

      - name: Android Build
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "Android" "$EXPORT_DIR/android/$EXPORT_NAME.apk" 2>&1 | tail -20

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/android

      - name: Verify Android APK
        run: |
          echo "📦 Files in Android build:"
          ls -lh build/android/
          APK="build/android/$EXPORT_NAME.apk"
          if [ -f "$APK" ]; then
            SIZE=$(stat -c%s "$APK")
            echo "✅ APK exists: $(ls -lh "$APK" | awk '{print $5}')"
            [ "$SIZE" -gt 1000000 ] && echo "✅ APK size > 1MB" || echo "⚠️ Small APK ($SIZE bytes)"
          else
            echo "❌ APK not found!"; exit 1
          fi

  ###########################################################################
  # NOTIFICATION
  ###########################################################################
  notify:
    name: Notification
    needs: [test, export-android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Collect job statuses & run UI/E2E tests via Godot 4.6
        id: status
        run: |
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT:0:7}"
          COMMIT_MSG="${{ github.event.head_commit.message || 'manual trigger' }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEST="${{ needs.test.result }}"
          ANDROID="${{ needs.export-android.result }}"

          # Run UI/E2E tests using the same Godot 4.6 binary downloaded in test-ui
          UI_RESULT="skipped"
          if [ "$ANDROID" = "success" ]; then
            if [ ! -f Godot_v4.6-stable_linux.x86_64 ]; then
              wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
              unzip -q Godot_v4.6-stable_linux.x86_64.zip
              chmod +x Godot_v4.6-stable_linux.x86_64
            fi
            UI_OUT=$(timeout 120 ./Godot_v4.6-stable_linux.x86_64 --headless --display-driver headless --audio-driver Dummy test/run_ui_tests.tscn 2>&1 | tail -3)
            echo "$UI_OUT"
            if echo "$UI_OUT" | grep -q "ALL UI TESTS PASSED"; then
              E2E_OUT=$(timeout 120 ./Godot_v4.6-stable_linux.x86_64 --headless --display-driver headless --audio-driver Dummy test/run_e2e_tests.tscn 2>&1 | tail -3)
              echo "$E2E_OUT"
              if echo "$E2E_OUT" | grep -q "ALL E2E TESTS PASSED"; then
                UI_RESULT="success"
              else
                UI_RESULT="failed"
              fi
            else
              UI_RESULT="failed"
            fi
          fi

          echo "test=${TEST}" >> $GITHUB_OUTPUT
          echo "ui=${UI_RESULT}" >> $GITHUB_OUTPUT
          echo "android=${ANDROID}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          echo "msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "actor=${ACTOR}" >> $GITHUB_OUTPUT
          echo "url=${RUN_URL}" >> $GITHUB_OUTPUT

      - name: Send Server酱 notification
        env:
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          if [ -z "$SCKEY" ]; then
            echo "⚠️ SCKEY not set — skipping notification"
            exit 0
          fi

          BRANCH="${{ steps.status.outputs.branch }}"
          COMMIT="${{ steps.status.outputs.commit }}"
          ACTOR="${{ steps.status.outputs.actor }}"
          URL="${{ steps.status.outputs.url }}"
          TEST="${{ steps.status.outputs.test }}"
          UI="${{ steps.status.outputs.ui }}"
          ANDROID="${{ steps.status.outputs.android }}"

          if [ "$TEST" = "success" ] && [ "$UI" = "success" ] && [ "$ANDROID" != "failure" ]; then
            TITLE="✅ Gomoku CI Passed [$BRANCH]"
          else
            TITLE="❌ Gomoku CI Failed [$BRANCH]"
          fi

          {
            echo "## Gomoku CI Report"
            echo ""
            echo "Branch: $BRANCH  |  Commit: $COMMIT  |  Author: $ACTOR"
            echo "──────────────────────────────"
            echo "🔬 Logic: $TEST  |  🖥️ UI: $UI  |  📱 Android: ${ANDROID:-skipped}"
            echo "──────────────────────────────"
            echo "🔗 ${URL}"
          } > /tmp/ci_notify.txt
          CONTENT=$(cat /tmp/ci_notify.txt)

          echo "Sending Server酱 notification..."
          curl -s -X POST "https://sctapi.ftqq.com/$SCKEY.send" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg title "$TITLE" --arg content "$CONTENT" '{title: $title, content: $content}')" \
            2>&1 || echo "⚠️ Server酱 send failed (non-critical)"
          echo ""
